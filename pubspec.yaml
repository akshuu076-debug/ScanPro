name: scanpro
description: Offline-first Android PDF scanner starter app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  pdf: ^3.11.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.4
  open_filex: ^4.6.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
